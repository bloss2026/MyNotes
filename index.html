<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2b59a2">
    <meta name="description" content="Bei MyNotes anmelden oder lokal mit deinen Notizen weiterarbeiten.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MyNotes">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="manifest" href="./manifest.json">
    <title>MyNotes – Anmelden</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 12% 10%, #dbeafe 0, transparent 38%),
                radial-gradient(ellipse at 92% 88%, #e0e7ff 0, transparent 36%),
                #f8fafc;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        :focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .login-shell {
            width: min(100%, 440px);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
            color: #0f172a;
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 13px;
            background: #2b59a2;
            box-shadow: 0 7px 16px #2b59a233;
            color: #fff;
            font-size: 14px;
            letter-spacing: 0;
        }

        .login-card {
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px #0f172a12;
        }

        h1 {
            margin: 0;
            color: #0f172a;
            font-size: 25px;
            letter-spacing: -0.03em;
            text-align: center;
        }

        .intro {
            margin: 10px 0 26px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.55;
            text-align: center;
        }

        .login-form {
            display: grid;
            gap: 10px;
        }

        .login-form label {
            margin-top: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 650;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            background: #fff;
            color: #0f172a;
            font-size: 15px;
        }

        .login-form input::placeholder {
            color: #94a3b8;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 5px 0 4px;
            color: #475569;
            font-size: 13px;
        }

        .remember-option input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #2b59a2;
        }

        .primary-button,
        .secondary-button,
        .local-link {
            display: flex;
            width: 100%;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border: 1px solid transparent;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 650;
            text-align: center;
            text-decoration: none;
            transition: background 150ms ease, border-color 150ms ease;
        }

        .primary-button {
            background: #2b59a2;
            color: #fff;
        }

        .primary-button:hover:not(:disabled) {
            background: #234b8b;
        }

        .secondary-button {
            border-color: #cbd5e1;
            background: #fff;
            color: #334155;
        }

        .secondary-button:hover:not(:disabled),
        .local-link:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .primary-button:disabled,
        .secondary-button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .login-status {
            min-height: 20px;
            margin: 4px 0 0;
            color: #475569;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .login-status.is-error {
            color: #b91c1c;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 14px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            height: 1px;
            flex: 1;
            background: #e2e8f0;
            content: "";
        }

        .local-link {
            border-color: #e2e8f0;
            background: #fff;
            color: #475569;
        }

        .local-note {
            margin: 12px 0 0;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 25px 20px;
                border-radius: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="brand" aria-label="MyNotes">
            <span class="brand-mark" aria-hidden="true">MN</span>
            <span>MyNotes</span>
        </div>
        <section class="login-card" aria-labelledby="loginHeading">
            <h1 id="loginHeading">Willkommen zurück</h1>
            <p class="intro">Melde dich an, um deine Notizen geräteübergreifend zu synchronisieren.</p>
            <form id="loginForm" class="login-form">
                <label for="loginEmail">E-Mail-Adresse</label>
                <input id="loginEmail" type="email" name="email" autocomplete="email" placeholder="name@beispiel.de" required>
                <label for="loginPassword">Passwort</label>
                <input id="loginPassword" type="password" name="password" autocomplete="current-password" required>
                <label class="remember-option" for="rememberMe">
                    <input id="rememberMe" type="checkbox" checked>
                    Angemeldet bleiben
                </label>
                <button id="signInButton" class="primary-button" type="submit">Anmelden</button>
                <button id="signUpButton" class="secondary-button" type="button">Konto erstellen</button>
                <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
            </form>
            <div class="divider">oder</div>
            <a class="local-link" href="./dashboard.html">Ohne Anmeldung lokal fortfahren</a>
            <p class="local-note">Deine lokal gespeicherten Notizen sind auch ohne Konto verfügbar.</p>
        </section>
    </main>
    <script>
        window.MYNOTES_SUPABASE_CONFIG = Object.freeze({
            url: 'https://ougmidncnjhnxzffynnr.supabase.co',
            publishableKey: 'sb_publishable_WpJ_arBnO8_S0vvFuVDNAQ_zl0fCM_F'
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./login.js"></script>
</body>
</html>
